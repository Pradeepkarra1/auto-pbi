name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Generate sample data
        run: python scripts/make_sample_data.py

      - name: Build example dashboard
        run: |
          auto-pbi build \
            --config examples/sales/dashboard.yaml \
            --out /tmp/auto-pbi-out

      - name: Validate generated project
        run: |
          test -f /tmp/auto-pbi-out/SalesPerformance.pbip
          test -f "/tmp/auto-pbi-out/SalesPerformance.Report/definition/pages/pages.json"
          python - <<'EOF'
          import json, pathlib
          root = pathlib.Path("/tmp/auto-pbi-out")
          for p in root.rglob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
          print("all JSON files parse OK")
          EOF

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-pbi"
version = "0.1.0"
description = "Config-driven Power BI dashboard generator: clean data + YAML business rules/KPIs -> native .pbip project"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AutoPBI contributors" }]
keywords = ["powerbi", "pbip", "tmdl", "pbir", "dashboard", "automation", "dax"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
auto-pbi = "auto_pbi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
